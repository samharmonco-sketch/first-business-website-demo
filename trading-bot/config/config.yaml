# Trading bot configuration. Secrets (API keys, private key paths) come from
# environment variables / .env, never hardcoded here. See .env.example.

mode: live  # paper | live -- "live" means real orders are placed via the exchange API.
            # Safe here ONLY because exchange.use_demo below is true: every order goes
            # to Kalshi's demo/sandbox account (demo-api.kalshi.co), never real money.
            # Do not set use_demo to false without a real live-trading review.

exchange:
  name: kalshi
  # true = Kalshi's demo/sandbox environment (fake money, real order matching).
  # false = real production Kalshi account with real money -- never flip this
  # without deliberately re-reviewing risk limits first.
  use_demo: true
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  demo_base_url: "https://demo-api.kalshi.co/trade-api/v2"
  request_timeout_seconds: 10

polling:
  interval_seconds: 60
  # Series/market tickers to watch. Crypto interval markets on Kalshi live
  # under series like KXBTC (BTC up/down hourly) / KXETH etc. Confirm exact
  # tickers in the Kalshi market catalog before going live -- these are
  # illustrative and may need adjusting.
  crypto_series_tickers:
    - "KXBTC"
    - "KXETH"
  # Confirmed against Kalshi's production /series catalog (12,146 series
  # scanned) -- these are the real game-level series tickers for individual
  # game moneylines; KXNFL/KXNBA/KXMLB/KXNHL (without "GAME") match unrelated
  # markets like season win-totals and draft props, not single games.
  sports_series_tickers:
    - "KXNFLGAME"
    - "KXNBAGAME"
    - "KXMLBGAME"
    - "KXNHLGAME"
  max_markets_per_cycle: 25

bankroll:
  starting_bankroll_usd: 1500.00
  max_position_usd: 50.00
  max_position_pct_of_bankroll: 0.05
  max_total_exposure_usd: 300.00
  daily_loss_limit_usd: 100000.00  # effectively disabled for paper-mode observation; restore a real
                                    # limit (e.g. 100.00) before ever running mode: live
  per_market_exposure_usd: 75.00
  per_strategy_exposure_usd: 150.00
  min_edge_to_trade: 0.05          # steady-state strategies require >=5% modeled edge
  min_confidence_to_trade: 0.55

exits:
  # Active position management: close a position early if it moves this
  # far from your average entry price, instead of only ever waiting
  # passively for the underlying Kalshi market to settle at expiry.
  take_profit_pct: 0.15   # close if price has risen >=15% from entry
  stop_loss_pct: 0.10     # close if price has fallen >=10% from entry

day_one:
  enabled: true
  # More permissive thresholds so the very first run produces a real,
  # small, risk-capped trade instead of an empty log.
  min_edge_to_trade: 0.02
  min_confidence_to_trade: 0.50
  max_position_usd: 5.00
  max_total_exposure_usd: 15.00
  # Once a real trade has been executed under day-one mode, it disables
  # itself permanently (state persisted in data/state.db).
  disable_after_first_trade: true

strategies:
  enabled:
    - dummy_buy         # smoke-test only; keep disabled outside paper-loop testing
    - crypto_momentum
    - mispricing
    - sports_ai
  dummy_buy:
    enabled: false
    size_usd: 1.00
  crypto_momentum:
    enabled: true
    lookback_ticks: 20
    momentum_threshold: 0.015     # 1.5% move over lookback triggers momentum signal
    mean_reversion_zscore: 2.0
  mispricing:
    enabled: true
    reference_price_source: coinbase   # coinbase | binance
    assumed_annualized_volatility: 0.55
    min_time_to_expiry_seconds: 120
  sports_ai:
    enabled: true
    anthropic_model: "claude-sonnet-5"
    max_events_per_cycle: 5
    min_data_confidence: 0.4
    # Match window (hours) between a TheOddsAPI event's commence_time and a
    # Kalshi market's close_time to consider them the same event. Kalshi's
    # close_time is NOT the game's kickoff/first-pitch time -- a real
    # diagnostic against the demo environment showed a consistent ~72-76
    # hour gap (settlement buffer), confirmed across both NFL and MLB
    # markets. 96 gives margin; the matcher also picks the closest game by
    # time within this window rather than requiring a single unique hit,
    # so a wide window doesn't cause it to grab the wrong game out of a
    # back-to-back series.
    match_window_hours: 96.0
    # Kalshi series ticker -> TheOddsAPI sport key. Add leagues here as you
    # confirm the correct Kalshi series ticker for them.
    series_to_sport_key:
      KXNFLGAME: "americanfootball_nfl"
      KXNBAGAME: "basketball_nba"
      KXMLBGAME: "baseball_mlb"
      KXNHLGAME: "icehockey_nhl"

risk:
  kill_switch_file: "data/KILL_SWITCH"
  state_db_path: "data/state.db"

logging:
  log_dir: "logs"
  level: "INFO"
  decisions_file: "decisions.jsonl"
  orders_file: "orders.jsonl"
  account_file: "account.jsonl"

anthropic:
  model: "claude-sonnet-5"
  max_tokens: 1024
